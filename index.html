
<!DOCTYPE html>
<html lang="tr" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#020617" />
    
    <!-- SEO Başlık ve Meta Bilgileri -->
    <title>Lunavor | Üst Düzey Yazılım ve Dijital Dönüşüm Ajansı</title>
    <meta name="description" content="Lunavor, yüksek performanslı web yazılımları, e-ticaret sistemleri ve kurumsal dijital çözümler üreten global bir mühendislik ajansıdır. Konya'nın en iyi yazılım ekibi." />
    <meta name="keywords" content="web tasarım, kurumsal yazılım, e-ticaret, lunavor, yazılım ajansı, konya yazılım, dijital pazarlama, seo, barış yıldırım, profesyonel yazılım" />
    <meta name="author" content="Lunavor Agency" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lunavor.com.tr/" />
    <meta property="og:title" content="Lunavor | Dijital Dünyanın Mimarı" />
    <meta property="og:description" content="Sıradanlığın ötesinde, yüksek performanslı yazılımlar ve markanızın ruhunu yansıtan dijital mimariler inşa ediyoruz." />
    <meta property="og:image" content="https://github.com/xbarisx2/logo/blob/main/lunavor_logo%20(1).png?raw=true" />

    <!-- Favicon Güncellemesi -->
    <link rel="icon" type="image/png" href="https://github.com/xbarisx2/logo/blob/main/lunavor_logo%20(1).png?raw=true" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;900&family=Sora:wght@400;700;800&display=swap" rel="stylesheet">
    
    <style>
      :root {
        --bg-dark: #020617;
        --accent-blue: #3b82f6;
      }
      body {
        font-family: 'Outfit', sans-serif;
        background-color: var(--bg-dark);
        color: #f8fafc;
        overflow-x: hidden;
      }
      h1, h2, h3, .font-heading {
        font-family: 'Sora', sans-serif;
      }
      .gradient-text {
        background: linear-gradient(to right, #ffffff 20%, #3b82f6 50%, #22d3ee 80%);
        background-size: 200% auto;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: textShine 5s ease-in-out infinite;
      }
      @keyframes textShine {
        to { background-position: 200% center; }
      }
      .glass-card {
        background: rgba(15, 23, 42, 0.5);
        backdrop-filter: blur(24px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .noise {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: url('https://grainy-gradients.vercel.app/noise.svg');
        opacity: 0.03;
        pointer-events: none;
        z-index: 9999;
      }
      .fluid-h1 {
        font-size: clamp(2.4rem, 9vw, 6.2rem);
        line-height: 1;
        letter-spacing: -0.04em;
      }
      .fluid-h2 {
        font-size: clamp(2rem, 5vw, 4.5rem);
        line-height: 1.1;
        letter-spacing: -0.03em;
      }
      @keyframes marquee {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
      }
      .marquee-content {
        display: flex;
        animation: marquee 40s linear infinite;
      }
      ::-webkit-scrollbar { width: 5px; }
      ::-webkit-scrollbar-track { background: var(--bg-dark); }
      ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--accent-blue); }
    </style>
  <script type="importmap">
{
  "imports": {
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.3",
    "framer-motion": "https://esm.sh/framer-motion@^12.31.0",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
  }
}
</script>
</head>
  <body>
    <div class="noise"></div>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
