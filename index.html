<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#020617" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- SEO Master Configuration -->
    <title>Lunavor | Global Digital Agency & Enterprise Software Engineering</title>
    <meta name="description" content="Lunavor is a premier global digital agency specializing in high-performance web design, enterprise software, and SEO domination. Architecting the future of digital brands." />
    <meta name="keywords" content="web design, custom software, SEO agency, digital transformation, enterprise web development, global branding, high-end production, UI/UX design" />
    <meta name="author" content="Lunavor" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-video-preview:-1, max-image-preview:large" />
    <link rel="canonical" href="https://lunavor.com.tr/" />
    
    <!-- Open Graph / Social Media Domination -->
    <meta property="og:locale" content="en_US" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Lunavor | Leading Global Software & Design Agency" />
    <meta property="og:description" content="Moving beyond boundaries with elite software engineering and cinematic digital production." />
    <meta property="og:url" content="https://lunavor.com.tr/" />
    <meta property="og:site_name" content="Lunavor" />
    <meta property="og:image" content="https://github.com/xbarisx2/logo/blob/main/lunavor_logo%20(1).png?raw=true" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    
    <!-- Twitter Domination -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lunavor | Future-Proof Digital Architectures" />
    <meta name="twitter:description" content="Top-tier web design and software engineering for global industry leaders." />
    <meta name="twitter:image" content="https://github.com/xbarisx2/logo/blob/main/lunavor_logo%20(1).png?raw=true" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://github.com/xbarisx2/logo/blob/main/lunavor_logo%20(1).png?raw=true" />
    <link rel="apple-touch-icon" href="https://github.com/xbarisx2/logo/blob/main/lunavor_logo%20(1).png?raw=true" />

    <!-- Structured Data (JSON-LD) for SEO Rankings -->
    <script type="application/ld+json">
    [
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Lunavor",
        "image": "https://github.com/xbarisx2/logo/blob/main/lunavor_logo%20(1).png?raw=true",
        "@id": "https://lunavor.com.tr/",
        "url": "https://lunavor.com.tr/",
        "telephone": "+905050627876",
        "priceRange": "$$$",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Technology Hub",
          "addressLocality": "Global",
          "addressCountry": "TR"
        },
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": 37.8714,
          "longitude": 32.4846
        },
        "openingHoursSpecification": {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"],
          "opens": "00:00",
          "closes": "23:59"
        },
        "sameAs": [
          "https://www.instagram.com/lunavor.com.tr/",
          "https://linkedin.com/company/lunavor"
        ]
      },
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "url": "https://lunavor.com.tr/",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://lunavor.com.tr/?s={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    ]
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;900&family=Sora:wght@400;700;800&display=swap" rel="stylesheet">
    
    <style>
      :root {
        --bg-dark: #020617;
        --accent-blue: #3b82f6;
      }
      body {
        font-family: 'Outfit', sans-serif;
        background-color: var(--bg-dark);
        color: #f8fafc;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      h1, h2, h3, h4, h5, h6, .font-heading {
        font-family: 'Sora', sans-serif;
      }
      .gradient-text {
        background: linear-gradient(to right, #ffffff 20%, #3b82f6 50%, #22d3ee 80%);
        background-size: 200% auto;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: textShine 5s ease-in-out infinite;
      }
      @keyframes textShine {
        to { background-position: 200% center; }
      }
      .glass-card {
        background: rgba(15, 23, 42, 0.4);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .noise {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: url('https://grainy-gradients.vercel.app/noise.svg');
        opacity: 0.02;
        pointer-events: none;
        z-index: 9999;
      }
      .fluid-h1 {
        font-size: clamp(2.2rem, 10vw, 6.2rem);
        line-height: 0.95;
        letter-spacing: -0.05em;
      }
      .fluid-h2 {
        font-size: clamp(1.8rem, 6vw, 4.5rem);
        line-height: 1.05;
        letter-spacing: -0.04em;
      }
      @keyframes marquee {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
      }
      .marquee-content {
        display: flex;
        animation: marquee 30s linear infinite;
      }
      /* Fast Interaction Optimization */
      * { transition-timing-function: cubic-bezier(0.16, 1, 0.3, 1); }
      ::selection { background: var(--accent-blue); color: #fff; }
      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-track { background: var(--bg-dark); }
      ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@^19.2.4",
        "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
        "react/": "https://esm.sh/react@^19.2.4/",
        "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
        "framer-motion": "https://esm.sh/framer-motion@^12.31.0",
        "vite": "https://esm.sh/vite@^7.3.1",
        "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.3"
      }
    }
    </script>
  </head>
  <body>
    <div class="noise"></div>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
